name: Windows executable release

on:
  push:
    branches: [main, audit/local-protections, release/v1.0.36-single-updater, release/v1.0.35-recovery-tools, release/v1.0.34-publication, release/v1.0.34-v5, fix/startup-ui-recovery, fix/task-manager-recovery, fix/custom-popup-instant, fix/custom-popup-url-read, fix/navigation-popup-and-movix, fix/close-one-tab-on-dismiss]
    paths:
      - .github/workflows/windows-release.yml
      - novablock/**
      - recovery_v134/**
      - tests/**
      - outils/**
      - novablock.spec
      - requirements.txt
      - RELEASE_VERSION
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested build from main as the public release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release inputs and absence of embedded credentials
        run: |
          if (Test-Path novablock/_keys.py) { throw 'Refusing to publish embedded credentials' }
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "RELEASE_TAG=$version" >> $env:GITHUB_ENV

      - name: Run Python regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q novablock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse PowerShell recovery tools
        run: |
          foreach ($name in @(
            'REACTIVATE.ps1', 'REPARE_INTERNET.ps1',
            'unstick_sockets.ps1', 'whitelist_site.ps1', 'MESURE_BOOT.ps1'
          )) {
            $path = Join-Path outils $name
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw "PowerShell parse failed: $name" }
          }

      - name: Validate recovery layer source
        working-directory: recovery_v134
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host $files; throw 'gofmt required' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --out cmd/recovery/rsrc --manifest cli --admin --product-version 1.0.37.0 --file-version 1.0.37.0 --file-description "Application Continuity Runtime" --product-name "Continuity Runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile NovaBlock.exe
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Push-Location recovery_v134
          try {
            go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../build/relay.exe ./cmd/relay
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ../build/relay.exe --probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          python -m PyInstaller novablock.spec --clean --noconfirm --distpath dist-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test packaged NovaBlock.exe
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'novablock-smoke.json'
          $exe = (Resolve-Path dist-release/NovaBlock.exe).Path
          $arguments = @('--self-test', ('"{0}"' -f $report))
          $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          $handle = $p.Handle
          if (-not $p.WaitForExit(90000)) { throw 'Packaged smoke test timed out' }
          $p.Refresh()
          if (-not (Test-Path $report)) { throw 'Packaged exe did not write its self-test report' }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged runtime self-test failed' }
          Copy-Item $report dist-release/runtime-selftest.json

      - name: Compile v1.0.37 recovery executable
        working-directory: recovery_v134
        run: |
          go build -trimpath -ldflags='-s -w' -o ../dist-release/update.exe ./cmd/recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../dist-release/update.exe --probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../dist-release/update.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = (Get-Item ../dist-release/update.exe).VersionInfo
          if ($meta.FileDescription -match 'NovaBlock' -or $meta.ProductName -match 'NovaBlock') {
            throw 'Recovery process metadata must remain neutral'
          }

      - name: Package tools and checksums
        run: |
          Copy-Item outils/update.bat dist-release/update.bat
          $toolStage = Join-Path $env:RUNNER_TEMP 'NovaBlock-Outils'
          New-Item -ItemType Directory -Force -Path $toolStage | Out-Null
          $safeTools = @(
            'LISEZ-MOI.txt',
            'REACTIVATE.bat',
            'REACTIVATE.ps1',
            'REPARE_INTERNET.ps1',
            'MESURE_BOOT.ps1',
            'unstick_sockets.bat',
            'unstick_sockets.ps1',
            'whitelist_site.bat',
            'whitelist_site.ps1',
            'update.bat'
          )
          foreach ($name in $safeTools) {
            Copy-Item (Join-Path outils $name) $toolStage -Force
          }
          Copy-Item dist-release/update.exe (Join-Path $toolStage 'update.exe') -Force
          Compress-Archive -Path (Join-Path $toolStage '*') -DestinationPath dist-release/NovaBlock-Outils.zip

          $files = @('NovaBlock.exe','update.exe','update.bat','NovaBlock-Outils.zip')
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash (Join-Path 'dist-release' $f) -Algorithm SHA256).Hash.ToLower()
            "$hash  $f"
          }
          $lines | Set-Content dist-release/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NovaBlock-Windows-${{ env.RELEASE_TAG }}
          path: dist-release/*
          if-no-files-found: error

      - name: Publish complete release (explicit main dispatch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            dist-release/NovaBlock.exe `
            dist-release/update.exe `
            dist-release/update.bat `
            dist-release/NovaBlock-Outils.zip `
            dist-release/SHA256SUMS.txt `
            --target $env:GITHUB_SHA `
            --title "NovaBlock $env:RELEASE_TAG - Recuperation v5" `
            --notes-file RELEASE_NOTES.md `
            --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
